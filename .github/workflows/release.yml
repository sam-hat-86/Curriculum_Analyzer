name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Onefile Application
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Restore Nuitka and ccache Cache
        uses: actions/cache@v4
        with:
          path: |
            .nuitka-cache
            .ccache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('v2/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ hashFiles('v2/requirements.txt') }}-
            ${{ runner.os }}-nuitka-

      - name: Build Onefile Package with Nuitka
        run: |
          python v2/tools/build_v2.py --onefile -y

      - name: Inspect generated artifacts
        shell: pwsh
        run: |
          Write-Host "Generated release artifacts:"
          Get-ChildItem v2\output\v* -File | Format-Table Name, Length, LastWriteTime

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            v2/output/v*/*.zip
          generate_release_notes: true
          body: |
            ## Curriculum Analyzer ${{ github.ref_name }} (Onefile 配布版)

            個別指導塾 カリキュラムチェックシステムの配布パッケージです。

            ### 利用手順
            1. 下記のアセット一覧から `Curriculum_Analyzer_${{ github.ref_name }}.zip` をダウンロードしてください。
            2. ダウンロードした ZIP ファイルを右クリックし、**「すべて展開」** を選択して任意のフォルダ（ドキュメントや作業フォルダ等）に解凍します。
            3. 解凍後のフォルダ内にある `Curriculum_Analyzer_${{ github.ref_name }}.exe` をダブルクリックして起動します。

  deploy-pages:
    name: Update Docs and Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update ver.json with release tag
        run: |
          python - << 'EOF'
          import json, re

          tag = '${{ github.ref_name }}'
          version_match = re.search(r'v?(\d+\.\d+)', tag)
          major_minor = version_match.group(1) if version_match else '2.1'
          zip_name = f'Curriculum_Analyzer_{tag}.zip'

          with open('docs/ver/ver.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          data['latest'] = major_minor
          data['latestTag'] = tag
          data['latestFile'] = zip_name

          for v in data.get('versions', []):
              if v.get('version') == major_minor:
                  v['tag'] = tag
                  v['downloadFile'] = zip_name
                  v['badge'] = '最新版'
                  v['badgeClass'] = 'badge-latest'
              else:
                  v['badge'] = '旧版'
                  v['badgeClass'] = 'badge-legacy'

          with open('docs/ver/ver.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Updated docs/ver/ver.json for release {tag}")
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
