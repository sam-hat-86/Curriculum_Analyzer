name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Onefile Application
    runs-on: windows-latest
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Restore Nuitka and ccache Cache
        uses: actions/cache@v4
        with:
          path: |
            .nuitka-cache
            .ccache
          key: ${{ runner.os }}-nuitka-${{ hashFiles('v2/requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nuitka-${{ hashFiles('v2/requirements.txt') }}-
            ${{ runner.os }}-nuitka-

      - name: Build Installer and Portable Packages with Nuitka
        run: |
          python v2/tools/build_v2.py --all -y

      - name: Inspect generated artifacts
        shell: pwsh
        run: |
          Write-Host "Generated release artifacts:"
          Get-ChildItem v2\output\v* -File | Format-Table Name, Length, LastWriteTime

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: |
            v2/output/v*/*.exe
          generate_release_notes: true
          body: |
            ## Curriculum Analyzer ${{ github.ref_name }}

            個別指導塾 カリキュラムチェックシステムの公式配布パッケージです。

            ### 配布ファイルのご案内
            1. **インストーラー版（推奨）: `Curriculum_Analyzer_${{ github.ref_name }}_setup.exe`**
               - ダウンロード後、ダブルクリックしてインストールします（管理者権限不要）。
               - デスクトップおよびスタートメニューに **「MSL分析ソフト」** アイコンが作成されます。
               - 次回以降のバージョンアップも新しい `setup.exe` を上書き実行するだけで完了します。
            2. **ポータブル版（単一EXE）: `Curriculum_Analyzer_${{ github.ref_name }}_portable.exe`**
               - インストール不要。ダウンロードした場所（USBメモリ等）でそのまま起動可能です。
               - データ（`user_data/`）はEXEと同じ場所に自己完結保存されます。

            ### ※ 初回実行時に Windows SmartScreen やスマート アプリ コントロール（SAC）の警告が出た場合
            - ダウンロードした `.exe` を右クリック ＞ **「プロパティ」** ＞「全般」タブ下部の **「許可する」**（またはブロック解除）にチェックを入れて **OK** を押してから再度実行してください。

  deploy-pages:
    name: Update Docs and Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update ver.json with release tag
        run: |
          python - << 'EOF'
          import json, re

          tag = '${{ github.ref_name }}'
          version_match = re.search(r'v?(\d+\.\d+)', tag)
          major_minor = version_match.group(1) if version_match else '2.3'
          setup_name = f'Curriculum_Analyzer_{tag}_setup.exe'
          portable_name = f'Curriculum_Analyzer_{tag}_portable.exe'

          with open('docs/ver/ver.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          data['latest'] = major_minor
          data['latestTag'] = tag
          data['latestFile'] = setup_name
          data['portableFile'] = portable_name

          for v in data.get('versions', []):
              if v.get('version') == major_minor:
                  v['tag'] = tag
                  v['downloadFile'] = setup_name
                  v['portableFile'] = portable_name
                  v['badge'] = '最新版'
                  v['badgeClass'] = 'badge-latest'
              else:
                  v['badge'] = '旧版'
                  v['badgeClass'] = 'badge-legacy'

          with open('docs/ver/ver.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f"Updated docs/ver/ver.json for release {tag}")
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
